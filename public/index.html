<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Lookup & Downloader</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .card { background: #161b22; padding: 25px; border-radius: 12px; width: 100%; max-width: 520px; border: 1px solid #30363d; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h1 { font-size: 1.4rem; text-align: center; margin-bottom: 20px; color: #f0f6fc; }
        
        .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #fff; font-size: 0.95rem; outline: none; }
        button { padding: 12px 18px; border-radius: 6px; border: none; background: #238636; color: white; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #2ea043; }
        button:disabled { background: #1e4a27; cursor: not-allowed; }

        .loader-box { display: none; text-align: center; padding: 25px 10px; }
        .spinner { width: 40px; height: 40px; border: 4px solid #30363d; border-top: 4px solid #388bfd; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 12px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader-text { font-size: 0.95rem; color: #58a6ff; font-weight: 600; }

        .result { background: #0d1117; border-radius: 8px; padding: 15px; border: 1px solid #30363d; display: none; margin-top: 15px; }
        .user-head { display: flex; align-items: center; gap: 15px; margin-bottom: 12px; }
        
        .avatar-wrapper { width: 80px; height: 80px; min-width: 80px; min-height: 80px; border-radius: 50%; border: 2px solid #388bfd; overflow: hidden; background: #161b22; display: flex; align-items: center; justify-content: center; }
        .avatar { width: 100%; height: 100%; object-fit: cover; }
        
        .btn-download { display: inline-block; width: 100%; text-align: center; padding: 8px 12px; background: #238636; color: #fff; text-decoration: none; border-radius: 5px; font-size: 0.8rem; font-weight: bold; margin-top: 6px; cursor: pointer; border: none; }
        .btn-download:hover { background: #2ea043; }
        
        .stats { display: flex; justify-content: space-around; background: #161b22; padding: 10px; border-radius: 6px; text-align: center; margin: 15px 0; border: 1px solid #30363d; }
        .stat-val { font-size: 1.1rem; font-weight: bold; color: #58a6ff; }
        .stat-lbl { font-size: 0.75rem; color: #8b949e; margin-top: 2px; }
        
        .posts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 15px; }
        .post-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .post-card img, .post-card video { width: 100%; height: 180px; object-fit: cover; }
        .post-card-body { padding: 8px; }
        .badge { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.75); color: #fff; padding: 3px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }

        .no-posts { grid-column: span 2; text-align: center; color: #8b949e; font-size: 0.85rem; padding: 15px 0; }
        .error { background: rgba(248, 81, 73, 0.15); border: 1px solid #f85149; color: #ff7b72; padding: 10px; border-radius: 6px; font-size: 0.85rem; display: none; margin-top: 10px; }

        .footer { margin-top: 20px; text-align: center; font-size: 0.85rem; color: #8b949e; }
        .footer a { color: #58a6ff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h1>📸 Instagram Lookup & Downloader</h1>
        <div class="search-box">
            <input type="text" id="username" placeholder="Enter handle (e.g. maximmuofficial)">
            <button id="searchBtn" onclick="searchUser()">Search</button>
        </div>

        <div id="errorBox" class="error"></div>

        <div id="loaderBox" class="loader-box">
            <div class="spinner"></div>
            <div class="loader-text">Instagram data loading...</div>
        </div>

        <div id="resultBox" class="result">
            <div class="user-head">
                <a id="avatarLink" target="_blank" class="avatar-wrapper">
                    <img id="avatar" class="avatar" src="" alt="DP">
                </a>
                <div style="flex: 1;">
                    <h2 id="fullName" style="font-size: 1.1rem; color: #fff;"></h2>
                    <p id="userHandle" style="color: #8b949e; font-size: 0.85rem;"></p>
                    <button id="dlProfileBtn" class="btn-download" style="width: auto; margin-top: 6px;">⬇️ Download Full HD DP</button>
                </div>
            </div>
            <p id="bio" style="font-size: 0.85rem; line-height: 1.4; color: #8b949e; margin-top: 5px; white-space: pre-line;"></p>

            <div class="stats">
                <div>
                    <div id="followers" class="stat-val">0</div>
                    <div class="stat-lbl">Followers</div>
                </div>
                <div>
                    <div id="following" class="stat-val">0</div>
                    <div class="stat-lbl">Following</div>
                </div>
                <div>
                    <div id="posts" class="stat-val">0</div>
                    <div class="stat-lbl">Posts</div>
                </div>
            </div>

            <h3 style="font-size: 0.95rem; color: #f0f6fc; margin-top: 15px;">Recent Posts & Reels</h3>
            <div id="postsGrid" class="posts-grid"></div>
        </div>
    </div>

    <div class="footer">
        Developer: <strong>Teamexe</strong> | Telegram: <a href="https://t.me/Configexe" target="_blank">@Configexe</a> | © 2026
    </div>

    <script>
        async function searchUser() {
            const handle = document.getElementById('username').value.trim();
            const errorBox = document.getElementById('errorBox');
            const resultBox = document.getElementById('resultBox');
            const loaderBox = document.getElementById('loaderBox');
            const searchBtn = document.getElementById('searchBtn');

            errorBox.style.display = 'none';
            resultBox.style.display = 'none';

            if (!handle) {
                errorBox.innerText = "Please enter a valid username.";
                errorBox.style.display = 'block';
                return;
            }

            // Reset Old UI Values completely on every search
            document.getElementById('fullName').innerText = '';
            document.getElementById('userHandle').innerText = '';
            document.getElementById('bio').innerText = '';
            document.getElementById('avatar').src = '';
            document.getElementById('followers').innerText = '0';
            document.getElementById('following').innerText = '0';
            document.getElementById('posts').innerText = '0';
            document.getElementById('postsGrid').innerHTML = '';

            loaderBox.style.display = 'block';
            searchBtn.disabled = true;

            try {
                const res = await fetch(`/api/lookup?handle=${encodeURIComponent(handle)}`);
                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || data.details || `HTTP ${res.status}`);
                }

                const user = data.profile || {};
                const mediaList = data.media || [];

                document.getElementById('fullName').innerText = user.full_name || handle;
                document.getElementById('userHandle').innerText = '@' + (user.username || handle);
                document.getElementById('bio').innerText = user.biography || 'No bio available';

                document.getElementById('followers').innerText = Number(user.followers || 0).toLocaleString();
                document.getElementById('following').innerText = Number(user.following || 0).toLocaleString();
                document.getElementById('posts').innerText = Number(user.posts_count || 0).toLocaleString();

                const avatarUrl = user.hq_avatar || '';
                if (avatarUrl) {
                    document.getElementById('avatar').src = avatarUrl;
                    document.getElementById('avatarLink').href = avatarUrl;
                }

                document.getElementById('dlProfileBtn').onclick = () => {
                    window.open(`/api/lookup?action=download&url=${encodeURIComponent(avatarUrl)}`, '_blank');
                };

                const postsGrid = document.getElementById('postsGrid');
                postsGrid.innerHTML = '';

                if (!mediaList || mediaList.length === 0) {
                    postsGrid.innerHTML = `<div class="no-posts">No media/reels found for this account.</div>`;
                } else {
                    mediaList.forEach(item => {
                        const isVideo = item.video_url || item.is_video || item.media_type === 2;
                        const mediaTargetUrl = isVideo ? item.video_url : (item.image_url || item.display_url || item.thumbnail_src || item.image_versions2?.candidates?.[0]?.url);
                        const coverImg = item.image_url || item.display_url || item.thumbnail_src || item.image_versions2?.candidates?.[0]?.url;

                        if (!mediaTargetUrl && !coverImg) return;

                        const postEl = document.createElement('div');
                        postEl.className = 'post-card';

                        let previewHtml = '';
                        if (isVideo && item.video_url) {
                            previewHtml = `
                                <span class="badge">🎬 REEL / VIDEO</span>
                                <video src="${item.video_url}" poster="${coverImg || ''}" controls preload="metadata"></video>
                            `;
                        } else {
                            previewHtml = `
                                <span class="badge">📸 PHOTO</span>
                                <img src="${coverImg || mediaTargetUrl}" alt="Post">
                            `;
                        }

                        const downloadUrl = mediaTargetUrl || coverImg;

                        postEl.innerHTML = `
                            ${previewHtml}
                            <div class="post-card-body">
                                <button class="btn-download" onclick="window.open('/api/lookup?action=download&url=${encodeURIComponent(downloadUrl)}', '_blank')">
                                    ${isVideo ? '⬇️ Download MP4' : '⬇️ Download HQ Photo'}
                                </button>
                            </div>
                        `;
                        postsGrid.appendChild(postEl);
                    });
                }

                resultBox.style.display = 'block';
            } catch (err) {
                errorBox.innerText = "Error: " + err.message;
                errorBox.style.display = 'block';
            } finally {
                loaderBox.style.display = 'none';
                searchBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
